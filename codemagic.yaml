workflows:
  android-workflow:
    name: Reminda Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Run Flutter Analyzer & Tests
        script: |
          flutter test
      - name: Build Android Release APK
        script: |
          flutter build apk --release --no-tree-shake-icons
      - name: Build Android App Bundle (AAB)
        script: |
          flutter build appbundle --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - alfiepolacas23@gmail.com
        notify:
          success: true
          failure: true

  ios-workflow:
    name: Reminda iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Run Flutter Analyzer & Tests
        script: |
          flutter test
      - name: Build iOS IPA (Release)
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/ios/archive/*.xcarchive
    publishing:
      email:
        recipients:
          - alfiepolacas23@gmail.com
        notify:
          success: true
          failure: true
